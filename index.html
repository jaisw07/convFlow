<!DOCTYPE html>
<html>

<head>
    <title>T1D Support Voice Agent</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Outfit:wght@400;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --ink: #14213d;
            --ink-soft: #2d4263;
            --paper: #f7f4ef;
            --accent: #ff6b35;
            --accent-deep: #d95124;
            --mint: #2f8f83;
            --card: rgba(255, 255, 255, 0.86);
            --border: rgba(20, 33, 61, 0.14);
            --shadow: 0 18px 45px rgba(20, 33, 61, 0.18);
        }

        body {
            font-family: "Outfit", "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 15% 15%, rgba(255, 176, 114, 0.45) 0%, transparent 38%),
                radial-gradient(circle at 85% 82%, rgba(47, 143, 131, 0.3) 0%, transparent 42%),
                linear-gradient(130deg, #f9e3ca 0%, #f7f4ef 45%, #d8ece8 100%);
            color: var(--ink);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: min(760px, 100%);
            text-align: center;
        }

        h1 {
            font-family: "Manrope", "Segoe UI", sans-serif;
            font-size: clamp(28px, 4vw, 40px);
            line-height: 1.1;
            margin: 12px 0 8px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            margin: 0 auto 24px;
            max-width: 620px;
            font-size: 16px;
            color: var(--ink-soft);
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: clamp(24px, 4vw, 44px);
            box-shadow: var(--shadow);
            backdrop-filter: blur(6px);
            animation: rise 420ms ease-out;
        }

        .pill {
            display: inline-block;
            background: rgba(47, 143, 131, 0.14);
            color: var(--mint);
            font-family: "Manrope", "Segoe UI", sans-serif;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 8px 12px;
            border-radius: 999px;
        }

        button {
            background: linear-gradient(135deg, var(--accent) 0%, #ff8a4f 100%);
            border: none;
            color: #fff;
            padding: 14px 30px;
            border-radius: 12px;
            font-family: "Manrope", "Segoe UI", sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 26px rgba(217, 81, 36, 0.3);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(217, 81, 36, 0.35);
        }

        button:disabled {
            background: #c6ccd6;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 20px;
            font-size: 14px;
            color: var(--ink-soft);
            font-family: "Manrope", "Segoe UI", sans-serif;
        }

        .mic {
            margin-top: 14px;
            font-size: 15px;
            color: var(--ink-soft);
        }

        @keyframes rise {
            from {
                transform: translateY(10px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="pill">Type 1 Diabetes Awareness</div>

            <h1>T1D Parent and Child Support Agent</h1>

            <p class="subtitle">
                Ask questions in Hindi, English, or Hinglish. You will get clear English guidance for care and emotional
                support.
            </p>

            <button id="connectBtn">Start Support Session</button>

            <div class="status" id="status">
                Status: Idle
            </div>

            <div class="mic" id="mic">
                Microphone inactive
            </div>

        </div>

    </div>

    <script type="module">

        import { Room } from "https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.esm.mjs";

        const statusEl = document.getElementById("status");
        const micEl = document.getElementById("mic");
        const button = document.getElementById("connectBtn");

        async function fetchToken() {
            const res = await fetch("http://localhost:8000/token");
            return await res.json();
        }

        button.onclick = async () => {

            button.disabled = true;
            statusEl.textContent = "Status: Connecting...";

            const data = await fetchToken();

            const room = new Room();

            room.on("trackSubscribed", (track, publication, participant) => {

                if (track.kind === "audio") {

                    const audio = track.attach();
                    audio.autoplay = true;

                    document.body.appendChild(audio);

                    statusEl.textContent = "Status: Support session in progress";
                }
            });

            await room.connect("ws://localhost:7880", data.token);

            await room.localParticipant.enableCameraAndMicrophone();

            micEl.textContent = "Microphone active";

            console.log("Connected to room:", data.room);

        };

    </script>

</body>

</html>
